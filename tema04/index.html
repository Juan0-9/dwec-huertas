<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora y bucles · Juan Hakram Huertas Chergui</title>

    <!-- CSS de Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Iconos de Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
    PLANTILLA DE LA TAREA 4
    · Solo trae lo imprescindible para empezar. La maquetación con Bootstrap es cosa tuya y cuenta en la nota:
      rejilla (row y col-*) que se adapte al móvil, cards, botones con color, grupos de botones, iconos...
    · Todo lo que va entre [corchetes] es un hueco: sustitúyelo por lo tuyo.
    · Tu JavaScript va en js/app.js. El archivo js/ayudas.js NO se toca.
  -->

    <!-- NAVBAR con tu nombre -->
    <nav class="navbar bg-primary" data-bs-theme="dark">
      <div class="container">
        <span class="navbar-brand"
          ><i class="bi bi-person-circle"></i> Juan Hakram Huertas Chergui</span
        >
        <span class="navbar-text">Tarea 4 · DWEC</span>
      </div>
    </nav>

    <!-- CABECERA -->
    <header class="bg-body-tertiary border-bottom py-4 mb-4">
      <div class="container">
        <h1 class="h2 mb-1">Calculadora y bucles</h1>
        <p class="lead mb-0 text-body-secondary">Suma, compara, y repite...</p>
      </div>
    </header>

    <main class="container mb-5">
      <!-- TODO: organiza las cards con la rejilla de Bootstrap: <div class="row"> y dentro <div class="col-12 col-lg-...">.
               En el móvil, una debajo de otra; en pantalla grande, repartidas en columnas. -->
      <div class="row g-4">
        <!-- LOS NÚMEROS. No cambies los id: leerNumero("numero1") y leerNumero("numero2") los buscan por su id -->
        <div class="col-12 col-lg">
          <section class="card mb-4">
            <div class="card-header">Los números</div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label for="numero1" class="form-label">Número 1</label>
                  <input type="number" id="numero1" class="form-control mb-3" />
                </div>
              </div>
              <div class="row g-3">
                <div class="col-12 col-sm-6">
              <label for="numero2" class="form-label">Número 2</label>
              <input type="number" id="numero2" class="form-control" />
                </div>
              </div>
            </div>
          </section>

          <!-- RESULTADO. Aquí escriben mostrar(), anadirLinea() y anadirBadge(). No cambies el id -->
          <section class="card mb-4">
            <div class="card-header">Resultado</div>
            <div class="card-body">
              <div id="salida"></div>
            </div>
          </section>
        </div>
        <!-- EJERCICIO 1 · Calculadora -->
        <section class="card mb-4">
          <div class="card-header">Calculadora</div>
          <div class="card-body">
            <button type="button" class="btn btn-primary" onclick="sumar()">
              Sumar
            </button>
            <button type="button" class="btn btn-primary" onclick="restar()">
              Restar
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="multiplicar()"
            >
              Multiplicar
            </button>
            <button type="button" class="btn btn-primary" onclick="dividir()">
              Dividir
            </button>
            <button type="button" class="btn btn-primary" onclick="potencia()">
              Potencia
            </button>
            <button type="button" class="btn btn-primary" onclick="modulo()">
              Modulo
            </button>
          </div>
        </section>

        <section class="card mb-4">
          <div class="card-header">Comparaciones</div>
          <div class="card-body">
            <button
              type="button"
              class="btn btn-primary"
              onclick="cualEsMayor()"
            >
              ¿Cuál es mayor?
            </button>
            <button type="button" class="btn btn-primary" onclick="parOImpar()">
              ¿Par o impar?
            </button>
          </div>
        </section>

        <section class="card mb-4">
          <div class="card-header">Bucles</div>
          <div class="card-body">
            <div class="btn-group" role="group" aria-label="Con badges">
              <button
                type="button"
                class="btn btn-primary"
                onclick="bucleFor()"
              >
                for
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="bucleWhile()"
              >
                while
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="bucleDoWhile()"
              >
                do...while
              </button>
            </div>
            <div class="btn-group" role="group" aria-label="Con texto">
              <button
                type="button"
                class="btn btn-primary"
                onclick="badgesFor()"
              >
                for
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="badgesWhile()"
              >
                while
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="badgesDoWhile()"
              >
                do..while
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="bg-body-tertiary border-top py-3">
      <div class="container small text-body-secondary">
        Juan Hakram Huertas Chergui · DWEC 26/27 · Tarea 4 · Las capturas, la
        reflexión y las fuentes están en el README.
      </div>
    </footer>

    <!-- JS de Bootstrap, las funciones de ayuda y, después, tu JavaScript. Este orden importa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ayudas.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
